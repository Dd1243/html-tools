# Netlify configuration for HTML Tools
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # No build command needed - pure static HTML
  publish = "."

# ============================================
# 安全响应头
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ============================================
# HTML：按「请求路径」匹配（本站是无扩展名 URL）
# 浏览器每次校验，边缘缓存 1 小时，过期后先回旧内容再后台刷新
# ============================================
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/tools/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/tools-directory"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/templates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/design-templates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/design-reference/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/about"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/contact"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/privacy-policy"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/terms"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

# ============================================
# 静态资源：浏览器 1 天，边缘 1 天，后台刷新
# ============================================
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/screenshots/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# ============================================
# 索引文件
# ============================================
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/sitemap.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=600, s-maxage=3600, stale-while-revalidate=86400"

# Redirects
[[redirects]]
  from = "/tool/*"
  to = "/tools/:splat"
  status = 301

# Note: /tools-directory does NOT need an explicit rule.
# Netlify/Cloudflare native pretty URLs handle it automatically.
# Explicit rules conflict with platform behavior → redirect loops.

# Pretty URLs (remove .html extension)
[[redirects]]
  from = "/tools/:tool"
  to = "/tools/:tool.html"
  status = 200

# Static files should be served directly (not redirected)
# sitemap.xml, robots.txt, etc.

# 404 handling - only for paths that don't match real files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
  force = false
