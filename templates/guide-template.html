<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} - WebUtils 使用指南</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="robots" content="index,follow" />
    <meta name="author" content="WebUtils" />
    <link rel="canonical" href="https://essays4u.net/guides/{{CATEGORY}}/{{SLUG}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="{{TITLE}} - WebUtils 使用指南" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="https://essays4u.net/guides/{{CATEGORY}}/{{SLUG}}" />
    <meta property="og:site_name" content="WebUtils" />
    <meta property="article:published_time" content="{{DATE_PUBLISHED}}" />
    <meta property="article:modified_time" content="{{DATE_MODIFIED}}" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TechArticle",
        "headline": "{{TITLE}}",
        "description": "{{DESCRIPTION}}",
        "datePublished": "{{DATE_PUBLISHED}}",
        "dateModified": "{{DATE_MODIFIED}}",
        "author": { "@type": "Organization", "name": "WebUtils" },
        "publisher": {
          "@type": "Organization",
          "name": "WebUtils",
          "url": "https://essays4u.net/"
        },
        "mainEntityOfPage": "https://essays4u.net/guides/{{SLUG}}"
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --line: rgba(15, 23, 42, 0.12);
        --accent: #0d9488;
        --accent-soft: rgba(13, 148, 136, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        line-height: 1.75;
        color: var(--text);
        background: linear-gradient(180deg, #070b15 0%, var(--bg) 28%);
      }
      main {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 72px;
      }
      nav.site-nav,
      footer.site-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 18px;
        padding: 16px 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .breadcrumb {
        margin: 8px 0 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .breadcrumb ol {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .breadcrumb li:not(:last-child)::after {
        content: "/";
        margin-left: 6px;
        color: #94a3b8;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.7rem, 4vw, 2.4rem);
        line-height: 1.25;
      }
      h2 {
        margin: 28px 0 12px;
        font-size: 1.3rem;
      }
      h3 {
        margin: 18px 0 8px;
        font-size: 1.05rem;
      }
      .meta {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .lead {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 1.05rem;
      }
      .cta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 24px;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--accent-soft);
      }
      .cta strong {
        color: var(--text);
      }
      .cta-btn {
        display: inline-flex;
        align-items: center;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff !important;
        font-weight: 600;
        text-decoration: none !important;
      }
      .cta-btn:hover {
        filter: brightness(0.95);
      }
      .card {
        margin-top: 18px;
        padding: 22px 24px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      }
      .toc a {
        display: block;
        margin: 6px 0;
      }
      p,
      li {
        color: var(--muted);
      }
      p {
        margin: 0 0 12px;
      }
      ul,
      ol {
        margin: 0 0 12px;
        padding-left: 1.2rem;
      }
      li {
        margin: 0.35rem 0;
      }
      .tool-grid {
        display: grid;
        gap: 12px;
      }
      @media (min-width: 640px) {
        .tool-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .tool-card {
        display: block;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #f8fafc;
        color: inherit;
        text-decoration: none;
      }
      .tool-card:hover {
        border-color: var(--accent);
        text-decoration: none;
      }
      .tool-card strong {
        display: block;
        color: var(--text);
        margin-bottom: 4px;
      }
      .tool-card span {
        color: var(--muted);
        font-size: 0.9rem;
      }
      strong {
        color: #0f172a;
        font-weight: 600;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.92em;
        background: #f1f5f9;
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="site-nav" aria-label="主要导航">
        <a href="/">首页</a>
        <a href="/tools-directory">全部工具</a>
        <a href="/guides/">使用指南</a>
        <a href="/about">关于本站</a>
        <a href="/contact">联系我们</a>
      </nav>

      <nav class="breadcrumb" aria-label="breadcrumb">
        <ol>
          <li><a href="/">首页</a></li>
          <li><a href="/guides/">使用指南</a></li>
          <li><span>{{SHORT_TITLE}}</span></li>
        </ol>
      </nav>

      <article>
        <h1>{{TITLE}}</h1>
        <p class="meta">
          更新于 <time datetime="{{DATE_MODIFIED}}">{{DATE_MODIFIED}}</time>
          · 约 {{READING_MINUTES}} 分钟阅读
        </p>
        <p class="lead">{{LEAD}}</p>

        <div class="cta">
          <div>
            <strong>立即使用相关工具</strong>
            <div style="color: var(--muted); font-size: 0.92rem; margin-top: 4px">
              {{PRIMARY_TOOL_NAME}} — 浏览器内完成，无需安装
            </div>
          </div>
          <a class="cta-btn" href="{{PRIMARY_TOOL_URL}}">打开工具 →</a>
        </div>

        <section class="card toc">
          <h2 style="margin-top: 0">目录</h2>
          <!-- TOC_ITEMS -->
        </section>

        <!-- GUIDE_BODY -->

        <section class="card">
          <h2 style="margin-top: 0">相关工具</h2>
          <div class="tool-grid">
            <!-- RELATED_TOOLS -->
          </div>
        </section>

        <section class="card">
          <h2 style="margin-top: 0">继续浏览</h2>
          <p>
            返回
            <a href="/guides/">全部使用指南</a>
            ，或查看
            <a href="{{PRIMARY_TOOL_URL}}">{{PRIMARY_TOOL_NAME}}</a>
            与
            <a href="/tools-directory">全部工具目录</a>。
          </p>
        </section>
      </article>

      <footer class="site-footer">
        <a href="/">首页</a>
        <a href="/tools-directory">全部工具</a>
        <a href="/guides/">使用指南</a>
        <a href="/about">关于本站</a>
        <a href="/contact">联系我们</a>
        <a href="/privacy-policy">隐私政策</a>
      </footer>
    </main>
  </body>
</html>
